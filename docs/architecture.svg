<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JalDrishti deployment on the four lab systems</title>
  <desc id="d">Browsers reach the public address 10.1.75.53:3297, which the lab host forwards to port 3000 on sys1. A Go gateway on sys1 serves the frontend, caches results and load-balances analysis requests over four Python workers, one per system. sys2 also runs PostgreSQL for saved sites. Workers read memory-mapped Copernicus elevation tiles and cached Open-Meteo rainfall.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3e4a63"/>
    </marker>
  </defs>
  <rect width="980" height="580" rx="14" fill="#f6f8f4"/>

  <!-- clients -->
  <g>
    <rect x="24" y="210" width="150" height="112" rx="10" fill="#fff" stroke="#14213d" stroke-width="1.5"/>
    <text x="99" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#14213d">Browser</text>
    <text x="99" y="262" text-anchor="middle" font-size="12.5" fill="#3e4a63">React + Leaflet</text>
    <text x="99" y="280" text-anchor="middle" font-size="12.5" fill="#3e4a63">select land on map,</text>
    <text x="99" y="298" text-anchor="middle" font-size="12.5" fill="#3e4a63">see pond + catchment</text>
  </g>
  <line x1="176" y1="266" x2="236" y2="266" stroke="#3e4a63" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="206" y="252" text-anchor="middle" font-size="11.5" fill="#677086">HTTP</text>

  <!-- NAT -->
  <rect x="240" y="236" width="104" height="60" rx="8" fill="#fff" stroke="#9aa3b5" stroke-dasharray="4 3"/>
  <text x="292" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#14213d">10.1.75.53:3297</text>
  <text x="292" y="277" text-anchor="middle" font-size="11.5" fill="#677086">lab host NAT</text>
  <line x1="346" y1="266" x2="384" y2="266" stroke="#3e4a63" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="365" y="253" text-anchor="middle" font-size="11" fill="#677086">:3000</text>

  <!-- sys1 -->
  <rect x="388" y="60" width="252" height="412" rx="12" fill="#e4effa" stroke="#1766b5" stroke-width="1.5"/>
  <text x="404" y="86" font-size="15" font-weight="700" fill="#0b4f94">sys1</text>
  <text x="624" y="86" text-anchor="end" font-size="12" fill="#3e4a63">1 CPU · 512 MiB</text>
  <rect x="404" y="100" width="220" height="250" rx="9" fill="#fff" stroke="#1766b5"/>
  <text x="418" y="124" font-size="14" font-weight="700" fill="#14213d">Go gateway</text>
  <g font-size="12.3" fill="#3e4a63">
    <text x="418" y="148">static frontend, pre-gzipped</text>
    <text x="418" y="170">result cache 96 MB (LRU, 6 h)</text>
    <text x="418" y="192">single-flight: identical requests</text>
    <text x="430" y="208">share one computation</text>
    <text x="418" y="230">least-in-flight balancing,</text>
    <text x="430" y="246">2 slots per worker</text>
    <text x="418" y="268">queue of 256, then fast 503</text>
    <text x="418" y="290">retry on another worker</text>
    <text x="418" y="312">health check every 2 s</text>
    <text x="418" y="334">/gateway/status metrics</text>
  </g>
  <rect x="404" y="366" width="220" height="90" rx="9" fill="#fff" stroke="#9aa3b5"/>
  <text x="418" y="390" font-size="14" font-weight="700" fill="#14213d">Worker sys1</text>
  <text x="418" y="411" font-size="12.3" fill="#3e4a63">127.0.0.1:4297, nice 10</text>
  <text x="418" y="429" font-size="12.3" fill="#3e4a63">(gateway keeps CPU priority)</text>
  <text x="418" y="447" font-size="12.3" fill="#3e4a63">FastAPI + NumPy</text>
  <line x1="514" y1="352" x2="514" y2="364" stroke="#3e4a63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- workers -->
  <g>
    <line x1="626" y1="180" x2="698" y2="118" stroke="#3e4a63" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="626" y1="225" x2="698" y2="260" stroke="#3e4a63" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="626" y1="270" x2="698" y2="394" stroke="#3e4a63" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="664" y="202" text-anchor="middle" font-size="11" fill="#677086" transform="rotate(-8 664 202)">172.17.0.x</text>
  </g>
  <g>
    <rect x="702" y="44" width="254" height="126" rx="12" fill="#fff" stroke="#14213d" stroke-width="1.3"/>
    <text x="718" y="68" font-size="15" font-weight="700" fill="#14213d">sys2</text>
    <text x="940" y="68" text-anchor="end" font-size="12" fill="#3e4a63">1 CPU · 512 MiB</text>
    <text x="718" y="92" font-size="12.3" fill="#3e4a63">Worker :3298</text>
    <rect x="718" y="104" width="222" height="52" rx="7" fill="#fff6e6" stroke="#e8a317"/>
    <text x="730" y="126" font-size="12.8" font-weight="700" fill="#14213d">PostgreSQL 16</text>
    <text x="730" y="145" font-size="12" fill="#3e4a63">saved sites (schema pond)</text>
  </g>
  <g>
    <rect x="702" y="200" width="254" height="112" rx="12" fill="#fff" stroke="#14213d" stroke-width="1.3"/>
    <text x="718" y="224" font-size="15" font-weight="700" fill="#14213d">sys3</text>
    <text x="940" y="224" text-anchor="end" font-size="12" fill="#3e4a63">1 CPU · 512 MiB</text>
    <text x="718" y="248" font-size="12.3" fill="#3e4a63">Worker :3299</text>
    <text x="718" y="268" font-size="12.3" fill="#3e4a63">one analysis at a time,</text>
    <text x="718" y="286" font-size="12.3" fill="#3e4a63">busy → 503 → gateway retries</text>
  </g>
  <g>
    <rect x="702" y="340" width="254" height="112" rx="12" fill="#fff" stroke="#14213d" stroke-width="1.3"/>
    <text x="718" y="364" font-size="15" font-weight="700" fill="#14213d">sys4</text>
    <text x="940" y="364" text-anchor="end" font-size="12" fill="#3e4a63">1 CPU · 512 MiB</text>
    <text x="718" y="388" font-size="12.3" fill="#3e4a63">Worker :3300</text>
    <text x="718" y="408" font-size="12.3" fill="#3e4a63">DEM tiles memory-mapped</text>
    <text x="718" y="426" font-size="12.3" fill="#3e4a63">(9 tiles, 446 MB on disk)</text>
  </g>

  <!-- external data -->
  <rect x="24" y="488" width="932" height="72" rx="10" fill="#fff" stroke="#b8643a" stroke-dasharray="5 4"/>
  <text x="44" y="510" font-size="13" font-weight="700" fill="#14213d">External data, fetched once and cached on each worker</text>
  <text x="44" y="530" font-size="12.3" fill="#3e4a63">Copernicus GLO-30 elevation (AWS Open Data): one 1° tile per region, stored as a memory-mapped array.</text>
  <text x="44" y="548" font-size="12.3" fill="#3e4a63">Open-Meteo ERA5 daily rainfall 2015-2024: one call per 0.1° cell. Place search (Nominatim) runs in the browser.</text>
</svg>
