# JalDrishti on one machine, with OpenTelemetry.
#
#     docker compose up -d --build --wait
#
#   app          http://localhost:8080          (frontend + API through the Go gateway)
#   Jaeger       http://localhost:16686         traces
#   Grafana      http://localhost:3000          dashboard, logs (Loki), traces
#   Prometheus   http://localhost:9090          metrics
#
# Like the lab deployment: one Go gateway in front of analysis workers (here two, each with
# 1 CPU and 512 MiB like one lab system) and PostgreSQL for saved sites. Every service sends
# traces, metrics and logs over OTLP to the OpenTelemetry Collector, which passes them on to
# Jaeger, Prometheus and Loki. All ports are bound to this machine only (127.0.0.1 / ::1);
# Grafana's anonymous admin access is meant for that local use only.

name: jaldrishti

x-otel: &otel                        # environment of everything that exports telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "10000"   # push metrics every 10 s (default 60 s)

x-worker-env: &worker-env
  <<: *otel
  OTEL_SERVICE_NAME: pond-worker
  OTEL_SEMCONV_STABILITY_OPT_IN: http    # stable HTTP names, e.g. http.server.request.duration (s)
  APP_VERSION: ${APP_VERSION:-local}
  POND_DATA: /data
  PG_DSN: postgresql://pond:${PG_PASSWORD:-pond-local-only}@postgres:5432/pond
  # as in deploy/pondctl.sh: 1 CPU per worker, so no extra BLAS threads; fewer malloc arenas
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MALLOC_ARENA_MAX: "2"

x-worker: &worker
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: jaldrishti/worker:otel
  volumes:
    - pond-data:/data                # DEM tiles and rainfall cache, shared by both workers
  depends_on:
    postgres:
      condition: service_healthy
    otel-collector:
      condition: service_started
  restart: unless-stopped
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }

services:
  # ------------------------------------------------------------------ the application
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: pond
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pond-local-only}   # local only; not published
      POSTGRES_DB: pond
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pond -d pond"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker1:
    <<: *worker
    hostname: worker1
    environment:
      <<: *worker-env
      WORKER_NAME: worker1

  worker2:
    <<: *worker
    hostname: worker2
    environment:
      <<: *worker-env
      WORKER_NAME: worker2

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: jaldrishti/gateway:otel
    hostname: gateway
    command: ["-addr", "0.0.0.0:8080", "-static", "/app/dist",
              "-workers", "worker1=http://worker1:8001,worker2=http://worker2:8001",
              "-version", "${APP_VERSION:-local}"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: pond-gateway
      OTEL_BROWSER_TRACES_URL: http://otel-collector:4318/v1/traces   # browser spans arrive via the gateway
      GOMEMLIMIT: 150MiB
      GOGC: "50"
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [jaeger, loki]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0      # all-in-one, traces kept in memory
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jaldrishti.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, jaeger]
    restart: unless-stopped

volumes:
  pond-data: {}
  pg-data: {}
