# Prometheus pulls metrics every 10 s.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # metrics of the gateway and the workers, as exposed by the collector's prometheus exporter
  - job_name: otel-collector-exporter
    honor_labels: true          # keep job=<service> and instance=<service.instance.id> from OTLP
    static_configs:
      - targets: ["otel-collector:8889"]

  # the collector's own health: received / sent / refused spans, metric points, log records
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
