# OpenTelemetry Collector: the gateway, the workers and the browser all send their telemetry
# here over OTLP. It protects itself (memory_limiter), tags everything with the environment,
# batches, and hands each signal to the backend that stores it.
#
#   traces  -> Jaeger      (OTLP/gRPC)
#   metrics -> Prometheus  (exposed on :8889, Prometheus scrapes it)
#   logs    -> Loki        (OTLP/HTTP)
#   all     -> debug       (a summary line per batch in `docker compose logs otel-collector`)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: deployment.environment.name
        value: laptop-docker
        action: upsert
  batch:
    timeout: 2s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true   # needed for exemplars (metric sample -> trace id)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/loki, debug]
